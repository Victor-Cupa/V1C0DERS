[build]
  # Esta es la ruta donde Angular genera los archivos tras el build
  # Ajusta 'portafolio-web' al nombre de tu proyecto en angular.json
  publish = "dist/portafolio-web/browser"
  command = "npm run build"

[dev]
  # Puerto donde corre Netlify Dev
  port = 8888
  # Comando para levantar Angular en modo desarrollo
  command = "npm start"
  # Indica a Netlify que debe esperar a que el puerto de Angular (4200) esté listo
  targetPort = 4200

[[redirects]]
  from = "/whatsapp"
  to = "https://wa.me/573134662785"
  status = 301
  
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data:; connect-src 'self' https://victorcupa.netlify.app;"