<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PortafolioWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
</head>
<body>
<app-root>
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #0b0f19; font-family: 'Orbitron', sans-serif;">
    
    <style>
      /* Animación de latido y resplandor neón para todo el logo SVG */
      .cyber-logo-completed {
        animation: pulseNeon 1.5s infinite alternate;
      }
      
      /* Animación de parpadeo estilo terminal */
      .terminal-text {
        margin-top: 20px; 
        color: #ffffff; 
        font-size: 1.2rem; 
        letter-spacing: 4px;
        font-family: 'Courier New', Courier, monospace;
        animation: blink 1.2s infinite;
      }

      /* Los Motores de Animación (Keyframes) */
      @keyframes pulseNeon { 
        0% { transform: scale(0.95); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(0, 238, 255, 0.5)); } 
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 20px #00eeff) drop-shadow(0 0 30px #00eeff); } 
      }
      @keyframes blink { 
        0%, 100% { opacity: 1; } 
        50% { opacity: 0.3; } 
      }
    </style>
    
    <svg viewBox="0 0 100 100" width="120" height="120" class="cyber-logo-completed">
      <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="rgba(0, 238, 255, 0.05)" stroke="#00eeff" stroke-width="3" />
      
      <text x="50" y="58" font-family="'Orbitron', sans-serif" font-size="28" font-weight="700" fill="#00eeff" text-anchor="middle" letter-spacing="2">VC</text>
    </svg>

    <div class="terminal-text">INICIALIZANDO SISTEMA...</div>
    
  </div>
</app-root>


</body>
</html>
