<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CupaLab | PortafolioWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  
  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
</head>
<body>
<app-root>
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #0b0f19; font-family: 'Orbitron', sans-serif;">
    
    <style>
      /* Animación de latido y resplandor neón para todo el logo SVG */
      .cyber-logo-completed {
        animation: pulseNeon 1.5s infinite alternate;
      }
      
      /* Animación de parpadeo estilo terminal */
      .terminal-text {
        margin-top: 20px; 
        color: #ffffff; 
        font-size: 1.2rem; 
        letter-spacing: 4px;
        font-family: 'Courier New', Courier, monospace;
        animation: blink 1.2s infinite;
      }

      /* Los Motores de Animación (Keyframes) */
      @keyframes pulseNeon { 
        0% { transform: scale(0.95); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(0, 238, 255, 0.5)); } 
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 20px #00eeff) drop-shadow(0 0 30px #00eeff); } 
      }
      @keyframes blink { 
        0%, 100% { opacity: 1; } 
        50% { opacity: 0.3; } 
      }
    </style>
    
<svg viewBox="0 0 100 125" width="120" height="150" class="cyber-logo-completed" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path stroke="#00eeff" stroke-width="2.5" d="M50 10 C30 10, 15 25, 15 45 C15 60, 25 70, 35 75 L35 85 L65 85 L65 75 C75 70, 85 60, 85 45 C85 25, 70 10, 50 10 Z"/>
      <path stroke="#00eeff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" d="M35 85 Q 50 70, 65 85 M40 80 Q 50 65, 60 80 M45 75 Q 50 60, 55 75"/>
      <path stroke="#00eeff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M42 35 L33 45 L42 55 M58 35 L67 45 L58 55 M53 30 L47 60"/>
      <text x="50" y="93" text-anchor="middle" stroke="#e0e0e0" fill="#e0e0e0" font-family="'Orbitron', sans-serif" font-size="7" font-weight="bold">CUPA</text>
      <path stroke="#e0e0e0" stroke-width="2" d="M35 85 L65 85 L62 95 L38 95 Z M38 95 L62 95 L60 100 L40 100 Z"/>
    </svg>

    <div class="terminal-text">INICIALIZANDO SISTEMA...</div>
    
  </div>
</app-root>


</body>
</html>
