<section class="portafolio" id="portafolio">
    <h2>Mis <span>Proyectos</span></h2>
    <p class="portafolio-subtitle">Desarrollos escalables construidos con las mejores prácticas de la industria.</p>
    
    <div class="proyectos-grid">
        @for (proyecto of listaProyectos; track proyecto.id) {
            
            <div class="proyecto-card">
                <div class="card-inner">
                    
                    <div class="card-front">
                        <div class="proyecto-img-container">
                            <img [src]="proyecto.imagenUrl" [alt]="proyecto.titulo" class="proyecto-img">
                        </div>
                        <div class="proyecto-info-front">
                            <h3>{{ proyecto.titulo }}</h3>
                            
                            <div class="proyecto-tech-stack">
                                @for (tech of proyecto.tecnologias; track tech.nombre) {
                                    <img [src]="tech.iconoUrl" [alt]="tech.nombre" [title]="tech.nombre" class="mini-tech-icon">
                                }
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-back">
                        <h3>{{ proyecto.titulo }}</h3>
                        <p class="proyecto-desc">{{ proyecto.descripcion }}</p>
                        
                        <div class="proyecto-links">
                            <a *ngIf="proyecto.linkProyecto" [href]="proyecto.linkProyecto" target="_blank" class="btn-solid">
                                <i class='bx bx-link-external'></i> Visitar
                            </a>
                        </div>
                    </div>

                </div>
            </div>
            }
    </div>
</section>
