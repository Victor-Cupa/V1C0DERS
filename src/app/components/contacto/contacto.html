<section class="contact" id="contacto">
    <h2 class="heading">Contácta<span>me</span></h2>

    <div class="contact-container">
        <div class="contact-info">
            <h3>¡Hablemos de tu próximo proyecto!</h3>
            <p>Trabajo en desarrollo de software y tecnología construyendo soluciones modernas y eficientes. Si tienes un reto, escríbeme.</p>
            
            <div class="info-item">
                <i class='bx bx-envelope'></i>
                <a href="mailto:{{ email }}" class="email-link">{{ email }}</a>
            </div>
            <div class="info-item">
                <i class='bx bx-globe'></i>
                <span>Disponibilidad para proyectos remotos</span>
            </div>
        </div>

        <form (submit)="enviarCorreo($event)" class="contact-form">
            <div class="input-stack">
                <input type="text" name="user_name" placeholder="Nombre Completo" required>
                <input type="email" name="user_email" placeholder="Correo Electrónico" required>
                <input type="text" name="subject" placeholder="Asunto del Mensaje" required>
                <textarea name="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            
            <div class="button-container">
                <button type="submit" [disabled]="enviando" class="btn">
                    {{ enviando ? 'Enviando...' : 'Enviar Mensaje' }}
                </button>
            </div>

            @if (mensajeEnviado) {
                <p style="color: #00eeff; margin-top: 1.5rem; text-align: right; font-size: 1.4rem; font-family: 'Poppins', sans-serif;">
                    ¡Mensaje enviado con éxito! Hablaremos pronto.
                </p>
            }
        </form>
    </div>
</section>
