<section class="aliados" id="aliados">
    <h2>Mis <span>Aliados</span></h2>
    <p class="aliados-subtitle">Soluciones tecnológicas construidas para transformar procesos y mejorar la experiencia de usuario.</p>

    <div class="carousel-wrapper" (mouseenter)="stopAutoPlay()" (mouseleave)="startAutoPlay()">
        
        <div class="carousel-indicators">
            @for (aliado of listaAliados; track aliado.id; let i = $index) {
                <span class="dot" 
                      [class.active]="i === currentIndex" 
                      (click)="goToSlide(i)">
                </span>
            }
        </div>

        <button class="nav-btn left-btn" (click)="prevSlide(); resetTimer()">
            <i class='bx bx-chevron-left'></i>
        </button>

        <div class="carousel-aliados" #carousel (scroll)="onScroll()">
            @for (aliado of listaAliados; track aliado.id) {
                
                <div class="aliado-card">
                    <div class="card-inner">
                        
                        <div class="card-front">
                            <div class="aliado-image-container">
                                <img [src]="aliado.imageUrl" [alt]="'Logo de ' + aliado.name" class="aliado-img">
                            </div>
                            <div class="aliado-content">
                                <h3>{{ aliado.name }}</h3>
                            </div>
                        </div>
                        
                        <div class="card-back">
                            <div class="card-back-content">
                                <h4>{{ aliado.name }}</h4>
                                <p>{{ aliado.slogan }}</p>
                            </div>
                        </div>

                    </div>
                </div>
                }
        </div>

        <button class="nav-btn right-btn" (click)="nextSlide(); resetTimer()">
            <i class='bx bx-chevron-right'></i>
        </button>
        
    </div>
</section>
